[pytest]
testpaths = tests
# Puts the backend root on sys.path so tests import `src.*` without a path hack.
pythonpath = .
# importlib mode lets several features each own a test_service.py without
# needing __init__.py files to disambiguate them.
# Tests needing Docker and the 8.4 GB TeX Live image are deselected by default:
# CI cannot reasonably pull it per run. Opt in with `-m texlive`.
addopts = -ra --import-mode=importlib -m "not texlive"
markers =
    texlive: needs Docker and the lumen-tex image (run with -m texlive)
filterwarnings =
    ignore::DeprecationWarning:starlette.*
