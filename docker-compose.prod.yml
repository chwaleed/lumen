services:
  postgres:
    image: postgres:16-alpine
    container_name: lumen-postgres
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - lumen-net

  backend:
    image: ${DOCKERHUB_USERNAME}/lumen-backend:latest
    container_name: lumen-backend
    env_file:
      - ./.env
    environment:
      PORT: ${BACKEND_PORT:-9000}
      POSTGRES_CONNECTION_STRING: ${POSTGRES_CONNECTION_STRING:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lumen-net

  adminer:
    image: adminer:5.4.2
    container_name: lumen-adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lumen-net

  frontend:
    image: ${DOCKERHUB_USERNAME}/lumen-frontend:latest
    container_name: lumen-frontend
    env_file:
      - ./.env
    environment:
      PORT: ${FRONTEND_PORT:-3000}
      BACKEND_URL: http://backend:${BACKEND_PORT:-9000}
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - lumen-net

networks:
  lumen-net:
    driver: bridge

volumes:
  postgres-data:
