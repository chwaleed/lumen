[test]
# Scope `bun test` to the unit tree so it never tries to run Playwright specs
# (bun's default glob also matches *.spec.ts).
root = "tests/unit"

# lib/http/client.ts calls axios.create() at module scope, so the axios mock has
# to be registered before any test file imports it — preload runs first.
preload = ["./tests/unit/support/axios-mock.ts"]
